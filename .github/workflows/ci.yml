name: CI

on:
    push:
        branches: [master]
        tags: ['v*']
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Check toolchain
              run: node -v && npm -v && pwd

            # keytar (transitive dependency of @vscode/vsce) may fall back to a
            # native build if no prebuild matches the runner.
            - name: Install libsecret
              run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

            - run: npm ci

            - name: Type-check
              run: npm run check-types

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm test

            - name: Package VSIX
              run: npx vsce package

            - uses: actions/upload-artifact@v4
              with:
                  name: insertseq-vsix
                  path: '*.vsix'
                  if-no-files-found: error

    publish:
        needs: [build]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            - uses: actions/download-artifact@v4
              with:
                  name: insertseq-vsix
                  path: .

            - name: Publish to VS Code Marketplace
              run: |
                  VSIX_PATH="$(ls *.vsix | head -n1)"
                  npx vsce publish --pat "$VSCE_PAT" --packagePath "$VSIX_PATH"
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
